    <text x="120" y="408" fill="#ffb45c" font-size="34" font-family="ui-monospace,Menlo,monospace" style="text-shadow:0 0 14px rgba(255,180,92,.5)">51f2b98c60d37e4a19c8f0b23de576a1</text>
