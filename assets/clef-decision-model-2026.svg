<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39d0ff"/><stop offset="0.55" stop-color="#a78bfa"/><stop offset="1" stop-color="#ffb45c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39d0ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#39d0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb45c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffb45c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="500" fill="#07090f"/>
  <ellipse cx="320" cy="270" rx="330" ry="230" fill="url(#glow)"/>
  <ellipse cx="890" cy="280" rx="330" ry="230" fill="url(#glow2)"/>

  <!-- left: autoregressive LLM token-by-token -->
  <g stroke="#a78bfa" stroke-width="2.2" fill="none" opacity="0.9">
    <rect x="120" y="130" width="330" height="240" rx="8"/>
    <line x1="120" y1="165" x2="450" y2="165"/>
  </g>
  <g fill="#a78bfa" font-family="ui-monospace,monospace" font-size="15" opacity="0.9">
    <text x="150" y="200">{ "u</text>
    <text x="150" y="230">{ "ur</text>
    <text x="150" y="260">{ "urg</text>
    <text x="150" y="290">{ "urgent": tr</text>
  </g>
  <text x="150" y="325" fill="#ff7ab8" font-size="14">한 글자씩 · 형식 이탈 가능</text>
  <text x="150" y="425" fill="#7c8aa5" font-size="16">글 생성 LLM · 초 단위</text>
  <g transform="rotate(6 285 118)">
    <line x1="200" y1="100" x2="380" y2="140" stroke="#ff7ab8" stroke-width="4"/>
    <line x1="380" y1="100" x2="200" y2="140" stroke="#ff7ab8" stroke-width="4"/>
  </g>

  <!-- middle arrow -->
  <g>
    <path d="M520 250 h110 m0 0 l-18 -13 m18 13 l-18 13" stroke="#ffb45c" stroke-width="3.4" fill="none"/>
    <text x="498" y="300" fill="#ffb45c" font-size="16">비자기회귀</text>
    <text x="490" y="222" fill="#ffb45c" font-size="16" opacity="0.85">프리필 한 번</text>
  </g>

  <!-- right: decision model staff (music clef metaphor) -->
  <g stroke="#39d0ff" stroke-width="2.4" fill="none" opacity="0.95">
    <rect x="700" y="130" width="380" height="250" rx="10"/>
    <path d="M700 168 h380" stroke-width="1.4" opacity="0.7"/>
  </g>
  <g stroke="#39d0ff" stroke-width="1" opacity="0.35">
    <line x1="722" y1="210" x2="1058" y2="210"/>
    <line x1="722" y1="238" x2="1058" y2="238"/>
    <line x1="722" y1="266" x2="1058" y2="266"/>
    <line x1="722" y1="294" x2="1058" y2="294"/>
    <line x1="722" y1="322" x2="1058" y2="322"/>
  </g>
  <text x="730" y="300" fill="url(#g1)" font-size="86" font-weight="800">𝄞</text>
  <g fill="#39d0ff" font-family="ui-monospace,monospace" font-size="15">
    <text x="812" y="216">urgent → true · 0.94</text>
    <text x="812" y="256">team → billing · 0.88</text>
    <text x="812" y="296">severity → Major · 0.71</text>
  </g>
  <circle cx="796" cy="211" r="5" fill="#39d0ff"/>
  <circle cx="796" cy="251" r="5" fill="#ffb45c"/>
  <circle cx="796" cy="291" r="5" fill="#a78bfa"/>
  <text x="742" y="344" fill="#7c8aa5" font-size="14">텍스트 0 · 확률만 병렬 채점</text>
  <text x="742" y="425" fill="#39d0ff" font-size="16">Clef · 중앙값 38.8ms(flash)</text>

  <text x="600" y="62" text-anchor="middle" fill="url(#g1)" font-size="33" font-weight="800">글을 안 쓰는 모델이 판정을 대신한다</text>
  <text x="600" y="96" text-anchor="middle" fill="#7c8aa5" font-size="18">Cloudflare Clef · Apache 2.0 · HackerNews 표 418 · 댓글 157</text>
</svg>
