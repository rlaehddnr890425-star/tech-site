  <path d="M 260 420 C 400 400, 560 320, 720 200 C 780 152, 840 128, 900 116" stroke="url(#g1)" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#soft)" opacity="0.9"/>
  <path d="M 260 420 C 400 400, 560 320, 720 200 C 780 152, 840 128, 900 116" stroke="url(#g1)" stroke-width="3.4" fill="none" stroke-linecap="round"/>

