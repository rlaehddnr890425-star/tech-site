      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ffb45c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb45c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb45c" stop-opacity="0"/>
