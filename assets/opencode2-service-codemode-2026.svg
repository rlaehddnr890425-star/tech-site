<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d0ff"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <!-- central service -->
  <rect x="500" y="190" width="200" height="120" rx="16" fill="none" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)"/>
  <text x="600" y="240" fill="#e8f4ff" font-size="26" font-weight="700" text-anchor="middle">opencode</text>
  <text x="600" y="272" fill="#39d0ff" font-size="17" text-anchor="middle">상주 서버 하나</text>
  <!-- clients -->
  <g stroke="#39d0ff" stroke-width="1.6" fill="none" opacity="0.85">
    <path d="M600 190 L330 110"/><path d="M600 190 L600 96"/><path d="M600 190 L870 110"/>
  </g>
  <g fill="none" stroke="#39d0ff" stroke-width="1.8">
    <rect x="250" y="60" width="160" height="52" rx="10"/>
    <rect x="520" y="40" width="160" height="52" rx="10"/>
    <rect x="790" y="60" width="160" height="52" rx="10"/>
  </g>
  <g fill="#9fd8ff" font-size="17" text-anchor="middle">
    <text x="330" y="92">TUI</text><text x="600" y="72">웹</text><text x="870" y="92">데스크톱</text>
  </g>
  <!-- MCP tools funnel into code mode -->
  <g fill="none" stroke="#ffb45c" stroke-width="1.6" opacity="0.9">
    <rect x="80" y="360" width="120" height="44" rx="9"/>
    <rect x="230" y="360" width="120" height="44" rx="9"/>
    <rect x="380" y="360" width="120" height="44" rx="9"/>
    <path d="M140 360 L300 320"/><path d="M290 360 L340 320"/><path d="M440 360 L400 320"/>
  </g>
  <g fill="#ffd9a8" font-size="15" text-anchor="middle">
    <text x="140" y="388">github MCP</text><text x="290" y="388">linear MCP</text><text x="440" y="388">OpenAPI</text>
  </g>
  <rect x="240" y="280" width="220" height="40" rx="10" fill="none" stroke="#ffb45c" stroke-width="2" filter="url(#glow)"/>
  <text x="350" y="306" fill="#ffd9a8" font-size="17" text-anchor="middle" font-weight="700">코드 모드 · 스크립트 1회</text>
  <path d="M460 300 L500 265" stroke="#ffb45c" stroke-width="1.8" fill="none"/>
  <!-- right: thousand tools note -->
  <text x="800" y="310" fill="#a78bfa" font-size="20" text-anchor="middle" font-weight="700">MCP 서버 “천 개”를</text>
  <text x="800" y="340" fill="#a78bfa" font-size="18" text-anchor="middle">컨텍스트 없이 조립</text>
  <text x="600" y="455" fill="#5f7391" font-size="15" text-anchor="middle">OpenCode 2.0 — T·Kor|HN 270|Anomaly|2026-10-14|테크한잔</text>
</svg>
