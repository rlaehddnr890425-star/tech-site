<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39d0ff"/><stop offset="0.55" stop-color="#a78bfa"/><stop offset="1" stop-color="#ffb45c"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="500" fill="#07090f"/>
  <text x="600" y="66" font-size="40" font-weight="bold" fill="url(#g1)" text-anchor="middle" filter="url(#glow)">읽을 때 8B·쓸 때 16B — 캐시 890B/token</text>
  <text x="600" y="102" font-size="20" fill="#8aa0b8" text-anchor="middle">DeepSeek-V4.1-Flash-1017 — 552B 백본·100만 컨텍스트·HBM 1/4·SSD 1/8</text>

  <!-- encoder/decoder asymmetric blocks -->
  <rect x="90" y="150" width="300" height="150" rx="14" fill="none" stroke="#39d0ff" stroke-width="2"/>
  <text x="240" y="185" font-size="22" fill="#39d0ff" text-anchor="middle">인코더 20층 (읽기)</text>
  <text x="240" y="218" font-size="18" fill="#c8d6e5" text-anchor="middle">토큰당 8B만 가동</text>
  <text x="240" y="248" font-size="16" fill="#8aa0b8" text-anchor="middle">KV를 여기서 한 번만 만든다</text>

  <rect x="470" y="150" width="300" height="150" rx="14" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="620" y="185" font-size="22" fill="#a78bfa" text-anchor="middle">디코더 20층 (쓰기)</text>
  <text x="620" y="218" font-size="18" fill="#c8d6e5" text-anchor="middle">토큰당 16B만 가동</text>
  <text x="620" y="248" font-size="16" fill="#8aa0b8" text-anchor="middle">앞 단의 상태를 투영해 사용</text>

  <line x1="390" y1="225" x2="470" y2="225" stroke="#ffb45c" stroke-width="3" marker-end="url(#arw)"/>
  <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#ffb45c"/></marker>

  <!-- KV cache warehouse -->
  <rect x="840" y="150" width="270" height="150" rx="14" fill="none" stroke="#ffb45c" stroke-width="2"/>
  <text x="975" y="185" font-size="22" fill="#ffb45c" text-anchor="middle">KV 창고</text>
  <text x="975" y="218" font-size="18" fill="#c8d6e5" text-anchor="middle">890바이트 / 토큰</text>
  <text x="975" y="248" font-size="16" fill="#8aa0b8" text-anchor="middle">CSA2 층 공유 + FP4 + 리플레이</text>

  <!-- price tags -->
  <g font-size="19" fill="#c8d6e5">
    <rect x="120" y="360" width="300" height="72" rx="12" fill="#0d1420" stroke="#1f2c3f"/>
    <text x="270" y="390" text-anchor="middle" fill="#39d0ff">입력 $0.08 / 100만 tok</text>
    <text x="270" y="416" text-anchor="middle" fill="#8aa0b8" font-size="16">캐시 읽기 $0.008 — 거의 공짜</text>
    <rect x="470" y="360" width="300" height="72" rx="12" fill="#0d1420" stroke="#1f2c3f"/>
    <text x="620" y="390" text-anchor="middle" fill="#a78bfa">출력 $0.50 / 100만 tok</text>
    <text x="620" y="416" text-anchor="middle" fill="#8aa0b8" font-size="16">출력이 짧아졌다 = 청구서도 짧게</text>
    <rect x="820" y="360" width="290" height="72" rx="12" fill="#0d1420" stroke="#1f2c3f"/>
    <text x="965" y="390" text-anchor="middle" fill="#ffb45c">MIT 라이선스 오픈웨이트</text>
    <text x="965" y="416" text-anchor="middle" fill="#8aa0b8" font-size="16">2026-10-17 스냅샷</text>
  </g>
</svg>
