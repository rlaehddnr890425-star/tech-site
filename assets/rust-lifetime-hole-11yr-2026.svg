<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d0ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ab8"/>
      <stop offset="1" stop-color="#ffb45c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <!-- 격자 담벼락 (타입 시스템) -->
  <g stroke="#1d2a44" stroke-width="2" fill="none">
    <rect x="330" y="70" width="540" height="360" rx="10"/>
    <line x1="330" y1="160" x2="870" y2="160"/>
    <line x1="330" y1="250" x2="870" y2="250"/>
    <line x1="330" y1="340" x2="870" y2="340"/>
    <line x1="510" y1="70" x2="510" y2="430"/>
    <line x1="690" y1="70" x2="690" y2="430"/>
  </g>
  <!-- 금 (unsoundness 구멍) -->
  <path d="M600 70 L575 150 L620 210 L560 290 L615 360 L585 430" stroke="url(#danger)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- 새어 나오는 참조 -->
  <g>
    <circle cx="560" cy="290" r="16" fill="none" stroke="url(#neon)" stroke-width="4"/>
    <path d="M560 290 C 470 330, 420 360, 250 385" stroke="url(#neon)" stroke-width="4" fill="none" stroke-dasharray="10 8"/>
    <text x="150" y="415" fill="#8fa3c8" font-family="monospace" font-size="22">&amp;'a String (죽음)</text>
    <text x="640" y="120" fill="#ff9ec4" font-family="monospace" font-size="24">11년 묵은 금</text>
    <text x="700" y="330" fill="#8fa3c8" font-family="monospace" font-size="22">'static 약속</text>
  </g>
  <!-- gauche crate 로고 느낌의Gear -->
  <g transform="translate(90,120)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="#ff7a45" stroke-width="6" stroke-dasharray="18 10"/>
    <circle cx="0" cy="0" r="18" fill="#ff7a45" opacity="0.85"/>
  </g>
  <text x="600" y="475" text-anchor="middle" fill="#5c6f92" font-family="monospace" font-size="20">issue #164250 · P-high · I-unsound · HN 694표</text>
</svg>
