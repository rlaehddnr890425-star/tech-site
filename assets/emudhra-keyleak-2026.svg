<text x="600" y="112" text-anchor="middle" fill="#8b93a7" font-size="24">eMudhra 유출 사건 · 2026-10-20 공개 · 해커뉴스 622표</text>
<rect x="60" y="170" width="510" height="270" rx="18" fill="#0d1420" stroke="#39d0ff" stroke-width="2"/>
<text x="315" y="218" text-anchor="middle" fill="#39d0ff" font-size="27" font-weight="700">브라우저권 — 비껴갔다</text>
<text x="315" y="268" text-anchor="middle" fill="#cfd6e4" font-size="21">투명성 로그 강제:</text>
<text x="315" y="300" text-anchor="middle" fill="#cfd6e4" font-size="21">로그에 없는 증서는 거부</text>
<text x="315" y="348" text-anchor="middle" fill="#7fe0b0" font-size="22" font-weight="700">공격될 수조차 없었다</text>
<text x="315" y="396" text-anchor="middle" fill="#8b93a7" font-size="19">파이어폭스 · 크롬 · 엣지 · 사파리</text>
