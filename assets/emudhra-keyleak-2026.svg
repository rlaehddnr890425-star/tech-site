<text x="885" y="396" text-anchor="middle" fill="#8b93a7" font-size="19">사물인터넷 · 앱 · curl · 언어 런타임</text>
<rect x="60" y="490" width="1080" height="90" rx="14" fill="#0d1420" stroke="#2a3245" stroke-width="1.5"/>
