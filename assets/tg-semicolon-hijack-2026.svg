<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d0ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ab8"/>
      <stop offset="1" stop-color="#ffb45c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#39d0ff" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200"/>
    <path d="M150 0 V500 M450 0 V500 M750 0 V500 M1050 0 V500"/>
  </g>
  <!-- browser window -->
  <g>
    <rect x="70" y="170" width="230" height="150" rx="12" fill="#0d1526" stroke="#2a3b5c" stroke-width="2"/>
    <rect x="70" y="170" width="230" height="30" rx="12" fill="#122038"/>
    <circle cx="92" cy="185" r="5" fill="#ff7ab8"/>
    <circle cx="110" cy="185" r="5" fill="#ffb45c"/>
    <circle cx="128" cy="185" r="5" fill="#39d0ff"/>
    <text x="185" y="255" font-family="monospace" font-size="20" fill="#7fa7d9" text-anchor="middle">https://</text>
    <text x="185" y="285" font-family="monospace" font-size="17" fill="#39d0ff" text-anchor="middle">302 → tg://</text>
  </g>
  <!-- arrow 1 -->
  <path d="M310 245 H420" stroke="url(#danger)" stroke-width="3" fill="none" filter="url(#glow)"/>
  <path d="M420 245 l-14 -8 v16 z" fill="#ff7ab8"/>
  <!-- socket pipe with semicolons -->
  <g>
    <rect x="430" y="195" width="290" height="100" rx="14" fill="#0d1526" stroke="#ff7ab8" stroke-width="2"/>
    <text x="575" y="228" font-family="monospace" font-size="17" fill="#ffb45c" text-anchor="middle">로컬 소켓 한 줄</text>
    <text x="575" y="262" font-family="monospace" font-size="19" fill="#ff7ab8" text-anchor="middle">OPEN:… ; OPEN:… ;</text>
    <text x="575" y="290" font-family="monospace" font-size="15" fill="#7fa7d9" text-anchor="middle">세미콜론이 경계가 된다</text>
  </g>
  <!-- arrow 2 -->
  <path d="M730 245 H840" stroke="url(#danger)" stroke-width="3" fill="none" filter="url(#glow)"/>
  <path d="M840 245 l-14 -8 v16 z" fill="#ff7ab8"/>
  <!-- app reading files -->
  <g>
    <rect x="850" y="150" width="270" height="190" rx="14" fill="#0d1526" stroke="url(#neon)" stroke-width="2"/>
    <text x="985" y="185" font-family="sans-serif" font-size="19" fill="#39d0ff" text-anchor="middle">이미 실행 중인 인스턴스</text>
    <rect x="880" y="210" width="100" height="26" rx="6" fill="#122038" stroke="#2a3b5c"/>
    <rect x="880" y="248" width="100" height="26" rx="6" fill="#122038" stroke="#2a3b5c"/>
    <rect x="880" y="286" width="100" height="26" rx="6" fill="#122038" stroke="#2a3b5c"/>
    <text x="930" y="228" font-family="monospace" font-size="13" fill="#ffb45c" text-anchor="middle">tdata/…</text>
    <text x="930" y="266" font-family="monospace" font-size="13" fill="#ffb45c" text-anchor="middle">tdata/…</text>
    <text x="930" y="304" font-family="monospace" font-size="13" fill="#ffb45c" text-anchor="middle">tdata/…</text>
    <path d="M1000 224 H1090 M1000 262 H1090 M1000 300 H1090" stroke="#ff7ab8" stroke-width="2"/>
    <path d="M1090 224 l-10 -6 v12 z M1090 262 l-10 -6 v12 z M1090 300 l-10 -6 v12 z" fill="#ff7ab8"/>
    <text x="1046" y="196" font-family="monospace" font-size="12" fill="#ff7ab8" text-anchor="middle">무확인 전송</text>
  </g>
  <text x="600" y="60" font-family="sans-serif" font-size="34" font-weight="bold" fill="#e8f1ff" text-anchor="middle" filter="url(#glow)">한 번의 클릭 → 세미콜론 injection → 세 파일 유출</text>
  <text x="600" y="455" font-family="monospace" font-size="16" fill="#39d0ff" text-anchor="middle">CVE-2026-107181 · CVSS 8.1 · 패치 버전 7.2.9</text>
</svg>
