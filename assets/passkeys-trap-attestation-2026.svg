<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d0ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <!-- user side -->
  <g stroke="#2a3b5c" fill="none" stroke-width="2">
    <rect x="70" y="150" width="220" height="200" rx="14"/>
    <rect x="110" y="90" width="140" height="40" rx="8"/>
  </g>
  <text x="180" y="70" font-family="monospace" font-size="17" fill="#39d0ff" text-anchor="middle">내 기기</text>
  <text x="180" y="116" font-family="monospace" font-size="14" fill="#8aa0c0" text-anchor="middle">OS · 칩 · 펌웨어 · 앱</text>
  <!-- passkey key -->
  <g filter="url(#glow)">
    <circle cx="180" cy="215" r="26" fill="none" stroke="url(#neon)" stroke-width="4"/>
    <rect x="198" y="211" width="64" height="9" fill="url(#neon)"/>
    <rect x="248" y="220" width="9" height="16" fill="url(#neon)"/>
    <rect x="228" y="220" width="9" height="12" fill="url(#neon)"/>
  </g>
  <text x="180" y="290" font-family="monospace" font-size="15" fill="#e6edf7" text-anchor="middle">passkey</text>
  <text x="180" y="316" font-family="monospace" font-size="12" fill="#7d8ea8" text-anchor="middle">복사? 전송? 보관? 확인?</text>
  <!-- attestation dial -->
  <g>
    <circle cx="480" cy="250" r="56" fill="#0e1626" stroke="#a78bfa" stroke-width="3"/>
    <line x1="480" y1="250" x2="516" y2="214" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
    <circle cx="480" cy="250" r="5" fill="#a78bfa"/>
  </g>
  <text x="480" y="346" font-family="monospace" font-size="15" fill="#a78bfa" text-anchor="middle">원격 인증</text>
  <text x="480" y="368" font-family="monospace" font-size="12" fill="#7d8ea8" text-anchor="middle">attestation</text>
  <!-- arrows -->
  <g stroke="#39d0ff" stroke-width="2.4" fill="none" opacity="0.85">
    <path d="M300 220 L404 238" marker-end="url(#arr)"/>
    <path d="M540 238 L668 212" marker-end="url(#arr)"/>
  </g>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#39d0ff"/></marker></defs>
  <!-- site side -->
  <g stroke="#2a3b5c" fill="none" stroke-width="2">
    <rect x="700" y="120" width="250" height="190" rx="14"/>
  </g>
  <text x="825" y="104" font-family="monospace" font-size="17" fill="#ffb45c" text-anchor="middle">사이트</text>
  <g font-family="monospace" font-size="13" fill="#ffb45c">
    <text x="722" y="158">요구 조건</text>
  </g>
  <g fill="#122038" stroke="#2a3b5c">
    <rect x="722" y="174" width="206" height="26" rx="6"/>
    <rect x="722" y="212" width="206" height="26" rx="6"/>
    <rect x="722" y="250" width="206" height="26" rx="6"/>
  </g>
  <g font-family="monospace" font-size="12" fill="#e6edf7">
    <text x="734" y="192">User-Verified 필수</text>
    <text x="734" y="230">Non-Copyable 필수</text>
    <text x="734" y="268">Hardware-Backed 필수</text>
  </g>
  <!-- verdict -->
  <g filter="url(#glow)">
    <rect x="1000" y="176" width="140" height="76" rx="12" fill="#0e1626" stroke="#ff7ab8" stroke-width="3"/>
  </g>
  <text x="1070" y="208" font-family="monospace" font-size="15" fill="#ff7ab8" text-anchor="middle">로그인</text>
  <text x="1070" y="232" font-family="monospace" font-size="15" fill="#ff7ab8" text-anchor="middle">수락 / 거부</text>
  <g stroke="#ff7ab8" stroke-width="2.4" fill="none" opacity="0.9">
    <path d="M954 214 L996 214" marker-end="url(#arr2)"/>
  </g>
  <defs><marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ff7ab8"/></marker></defs>
  <!-- bottom caption -->
  <text x="600" y="452" font-family="monospace" font-size="16" fill="#8aa0c0" text-anchor="middle">열쇠의 이름은 같지만, 다이얼 하나가 심사권을 사이트로 옮긴다</text>
</svg>
