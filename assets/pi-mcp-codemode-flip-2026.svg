<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39d0ff"/><stop offset="0.55" stop-color="#a78bfa"/><stop offset="1" stop-color="#ffb45c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39d0ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#39d0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb45c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffb45c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="500" fill="#07090f"/>
  <ellipse cx="320" cy="270" rx="330" ry="230" fill="url(#glow)"/>
  <ellipse cx="890" cy="280" rx="330" ry="230" fill="url(#glow2)"/>

  <!-- left: JSON tool call dump -->
  <g stroke="#a78bfa" stroke-width="2.2" fill="none" opacity="0.9">
    <rect x="120" y="130" width="330" height="240" rx="8"/>
    <line x1="120" y1="165" x2="450" y2="165"/>
  </g>
  <g fill="#a78bfa" font-size="15" opacity="0.9">
    <text x="150" y="200">{"tool": "search", …}</text>
    <text x="150" y="230">{"tool": "fetch", …}</text>
    <text x="150" y="260">{"tool": "update", …}</text>
    <text x="150" y="300" opacity="0.75">왕복 3번 · 중간값 전부</text>
    <text x="150" y="325" opacity="0.75">대화에 남음</text>
  </g>
  <text x="150" y="425" fill="#7c8aa5" font-size="16">전통 호출 · JSON 왕복</text>
  <g transform="rotate(6 285 118)">
    <line x1="200" y1="100" x2="380" y2="140" stroke="#ff7ab8" stroke-width="4"/>
    <line x1="380" y1="100" x2="200" y2="140" stroke="#ff7ab8" stroke-width="4"/>
  </g>

  <!-- middle arrow -->
  <g>
    <path d="M520 250 h110 m0 0 l-18 -13 m18 13 l-18 13" stroke="#ffb45c" stroke-width="3.4" fill="none"/>
    <text x="500" y="300" fill="#ffb45c" font-size="16">코드 모드로</text>
    <text x="500" y="222" fill="#ffb45c" font-size="16" opacity="0.85">한 편의 스크립트</text>
  </g>

  <!-- right: JS sandbox -->
  <g stroke="#39d0ff" stroke-width="2.4" fill="none" opacity="0.95">
    <rect x="700" y="130" width="380" height="250" rx="10"/>
    <path d="M700 168 h380" stroke-width="1.4" opacity="0.7"/>
  </g>
  <g stroke="#ff7ab8" stroke-width="1.8" fill="none" stroke-dasharray="6 5" opacity="0.9">
    <rect x="722" y="190" width="336" height="164" rx="8"/>
  </g>
  <g fill="#39d0ff" font-family="ui-monospace,monospace" font-size="15">
    <text x="742" y="222">const bugs = await mcp.search()</text>
    <text x="742" y="252">const ops = await Promise.all(…)</text>
    <text x="742" y="282">return summarize(bugs, ops)</text>
  </g>
  <text x="742" y="322" fill="#ff7ab8" font-size="14">샌드박스 · 반환 16KiB · 호출 50한</text>
  <text x="742" y="344" fill="#7c8aa5" font-size="14">파일·환경변수·net 차단</text>
  <text x="742" y="425" fill="#39d0ff" font-size="16">JS 샌드박스 · 왕복 1번</text>

  <text x="600" y="62" text-anchor="middle" fill="url(#g1)" font-size="33" font-weight="800">"MCP는 안 쓴다"가 한 달 만에 뒤집힌 이유</text>
  <text x="600" y="96" text-anchor="middle" fill="#7c8aa5" font-size="18">코어 내장 + 코드 모드 · HackerNews 표 635 · 댓글 350</text>
</svg>
