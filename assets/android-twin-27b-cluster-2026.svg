<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="neonline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d0ff"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <g stroke="#16324a" stroke-width="1" opacity="0.5">
    <line x1="0" y1="125" x2="1200" y2="125"/><line x1="0" y1="250" x2="1200" y2="250"/><line x1="0" y1="375" x2="1200" y2="375"/>
  </g>

  <!-- phone A -->
  <g filter="url(#glow)">
    <rect x="120" y="120" width="150" height="290" rx="22" fill="#0d1524" stroke="#39d0ff" stroke-width="2.5"/>
    <rect x="136" y="150" width="118" height="215" rx="8" fill="#0a1f2e"/>
    <text x="195" y="245" fill="#39d0ff" font-size="26" text-anchor="middle" font-weight="700">0-1</text>
    <text x="195" y="285" fill="#8fb7cc" font-size="16" text-anchor="middle">layers 1-32</text>
    <text x="195" y="395" fill="#5f7c92" font-size="15" text-anchor="middle">폰 A · 6GB</text>
  </g>

  <!-- phone B -->
  <g filter="url(#glow)">
    <rect x="930" y="120" width="150" height="290" rx="22" fill="#0d1524" stroke="#a78bfa" stroke-width="2.5"/>
    <rect x="946" y="150" width="118" height="215" rx="8" fill="#141026"/>
    <text x="1005" y="245" fill="#a78bfa" font-size="26" text-anchor="middle" font-weight="700">-1 0</text>
    <text x="1005" y="285" fill="#b9a8e8" font-size="16" text-anchor="middle">layers 33-64</text>
    <text x="1005" y="395" fill="#7c6fa0" font-size="15" text-anchor="middle">폰 B · 6GB</text>
  </g>

  <!-- RPC bridge -->
  <g filter="url(#glow)">
    <line x1="285" y1="265" x2="915" y2="265" stroke="url(#neonline)" stroke-width="3" stroke-dasharray="14 10"/>
    <polygon points="905,255 925,265 905,275" fill="#a78bfa"/>
    <polygon points="295,255 275,265 295,275" fill="#39d0ff"/>
  </g>
  <rect x="500" y="195" width="200" height="46" rx="10" fill="#0b1220" stroke="#ffb45c" stroke-width="1.6"/>
  <text x="600" y="225" fill="#ffb45c" font-size="19" text-anchor="middle" font-weight="700">C++ RPC · 50052</text>

  <!-- pooled memory chip -->
  <rect x="455" y="290" width="290" height="72" rx="12" fill="#0e1727" stroke="#39d0ff" stroke-width="1.4"/>
  <text x="600" y="320" fill="#e8f4fb" font-size="19" text-anchor="middle" font-weight="700">합산 RAM 웅덩이 12GB</text>
  <text x="600" y="346" fill="#8fb7cc" font-size="15" text-anchor="middle">27B ternary · 5.95GB 파일 · 발열 없음(제기)</text>

  <!-- title strip -->
  <text x="600" y="70" fill="#e8f4fb" font-size="30" text-anchor="middle" font-weight="800">중고 폰 두 대 = 하나의 27B 머신</text>
  <text x="600" y="460" fill="#5f7c92" font-size="16" text-anchor="middle">llama.cpp RPC 백엔드 · Hadamard ternary 1.75bit · r/LocalLLaMA 2026-10-13</text>
</svg>
