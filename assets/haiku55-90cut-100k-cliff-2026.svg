<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39d0ff"/><stop offset="0.55" stop-color="#a78bfa"/><stop offset="1" stop-color="#ffb45c"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="500" fill="#07090f"/>
  <text x="600" y="66" font-size="40" font-weight="bold" fill="url(#g1)" text-anchor="middle" filter="url(#glow)">$0.10 — 그런데 100K에서 5배</text>
  <text x="600" y="102" font-size="20" fill="#8aa0b8" text-anchor="middle">Claude Haiku 5.5 구간제 값표 — 100,000토큰 이하 입력 $0.10·출력 $0.50 / 초과분 $0.50·$2.50</text>

  <!-- axis -->
  <g stroke="#2a3550" stroke-width="1.5">
    <line x1="130" y1="420" x2="1080" y2="420"/>
    <line x1="130" y1="140" x2="130" y2="420"/>
  </g>
  <text x="120" y="150" font-size="15" fill="#5b6b85" text-anchor="end">MTok당</text>
  <text x="605" y="452" font-size="15" fill="#5b6b85" text-anchor="middle">한 요청의 입력 토큰 수</text>

  <!-- cheap segment (flat, low) -->
  <g>
    <line x1="130" y1="392" x2="640" y2="392" stroke="#39d0ff" stroke-width="5" filter="url(#glow)"/>
    <text x="300" y="378" font-size="19" fill="#39d0ff">입력 $0.10 · 출력 $0.50</text>
  </g>
  <!-- cliff at 100K -->
  <line x1="640" y1="392" x2="640" y2="230" stroke="#ff7ab8" stroke-width="5" stroke-dasharray="10 7"/>
  <circle cx="640" cy="392" r="8" fill="#07090f" stroke="#39d0ff" stroke-width="3"/>
  <circle cx="640" cy="230" r="8" fill="#ff7ab8" filter="url(#glow)"/>
  <text x="660" y="316" font-size="21" font-weight="bold" fill="#ff7ab8">×5 계단</text>
  <!-- expensive segment -->
  <g>
    <line x1="640" y1="230" x2="1080" y2="230" stroke="#ffb45c" stroke-width="5" filter="url(#glow)"/>
    <text x="770" y="214" font-size="19" fill="#ffb45c">초과분 $0.50 · $2.50</text>
  </g>
  <!-- 100K tick -->
  <line x1="640" y1="420" x2="640" y2="432" stroke="#8aa0b8" stroke-width="2"/>
  <text x="640" y="478" font-size="18" fill="#e8eef7" text-anchor="middle" font-weight="bold">100,000</text>
  <!-- old gen reference -->
  <line x1="130" y1="168" x2="1080" y2="168" stroke="#5b6b85" stroke-width="2" stroke-dasharray="4 8"/>
  <text x="1078" y="158" font-size="16" fill="#8aa0b8" text-anchor="end">전 세대 Haiku 4.5 — $1 · $5 (구간 없음)</text>
  <!-- p95 note -->
  <g>
    <path d="M860 300 C 900 340, 940 360, 1000 372" stroke="#a78bfa" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/>
    <text x="850" y="292" font-size="17" fill="#a78bfa" text-anchor="end">평균이 아니라 p95가</text>
    <text x="850" y="314" font-size="17" fill="#a78bfa" text-anchor="end">걸리는 자리를 확인하라</text>
  </g>
  <text x="1080" y="496" font-size="13" fill="#3c4a63" text-anchor="end">테크한잔 · 2026-10-08 · 값은 발표·공개 문서 실측</text>
</svg>
